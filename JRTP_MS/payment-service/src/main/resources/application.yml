eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
server:
    port: ${SERVER_PORT:9090}
spring:
    application:
        name: ${APP_NAME:PAYMENT-SERVICE}

management:
    endpoints:
        web:
            exposure:
                include: "*"
    health:
        readinessstate:
            enabled: true
        livenessstate:
            enabled: true
    endpoint:
        health:
            probes:
                enabled: true
